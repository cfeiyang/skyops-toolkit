[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stk-simulation"
version = "1.0.0"
description = "STK 12.6 global communication coverage duration application"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy>=1.23,<2.0",
    "pandas>=1.5,<3.0",
    "scipy>=1.9,<2.0",
    "matplotlib>=3.6,<4.0",
    "basemap>=1.3.6,<2.0",
    "PySide6>=6.5,<7.0",
]

[project.scripts]
stk-simulation = "stk_simulation.__main__:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.0,<7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stk_simulation = ["assets/*.ico"]
