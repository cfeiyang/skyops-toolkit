[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stk-aer-analysis"
version = "0.1.0"
description = "STK 12.6 visibility and AER analysis desktop application"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = ["PySide6>=6.5,<7.0"]

[project.optional-dependencies]
build = ["pyinstaller>=6.0,<7.0"]

[project.scripts]
stk-aer-analysis = "stk_aer_analysis.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

